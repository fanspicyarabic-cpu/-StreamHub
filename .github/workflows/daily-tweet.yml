name: Daily Movie Twitter Bot

on:
  schedule:
    # Runs everyday at 15:00 UTC (6:00 PM Saudi / Arabia Time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Post Daily Movie Tweet to X
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY || 'Oky8zpzizJDkVBn3EMUXNprJa' }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET || '3uAzTVfoA2YfBi3U4vXS5LW8BZWbg7hFFYSrSrOkKDTZRKKmTn' }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || '2099777594702929920-AUFyMcdLyXJyCltgOz4SLE8hXRPejE' }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || 'd3Q83GbaTbf3iT4kIQaEQLU0uiYK3FK76xrzh4z0lwqKI' }}
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID || 'VW95anNTVEsyQjN2d1pXOHNaWWw6MTpjaQ' }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET || 'zWxDUJx5bEC1cHHblKvTW72h7IRwtCClJ9YZNITIHV-696UXTg' }}
        run: node scripts/tweet-daily-movie.js

