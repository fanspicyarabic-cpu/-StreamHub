name: Daily Movie Twitter Bot

on:
  schedule:
    # Runs everyday at 15:00 UTC (6:00 PM Saudi / Arabia Time)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Post Daily Movie Tweet to X
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY || 'fhGoRryd6hINE3aqW0EFauABg' }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET || '6cnRTsA2BygzQVA512rwR2vqgZF44SQjyDHRcjqhdaVN2YXLgd' }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || '2099777594702929920-1xDXMaInKrcQLqABq55kK46vLEWiB6' }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || 'pTKSj521ZgpYqUiCDc85MmoHNUpQhg8VN4C1TnY4DY1FW' }}
        run: node scripts/tweet-daily-movie.js
